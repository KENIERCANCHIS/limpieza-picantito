<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Limpieza El Picantito</title>
<meta name="description" content="Tu zona, tu checklist de apertura y cierre, el rol de la semana y la capacitación de limpieza de El Picantito.">
<meta name="theme-color" content="#1447B8">
<meta property="og:type" content="website">
<meta property="og:title" content="Limpieza El Picantito">
<meta property="og:description" content="Mi zona, mi responsabilidad. Revisa tu zona y tus tareas de apertura y cierre.">
<meta property="og:image" content="https://keniercanchis.github.io/limpieza-picantito/media/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<link rel="icon" type="image/png" sizes="192x192" href="media/icon-192.png">
<link rel="apple-touch-icon" href="media/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" as="image" href="media/logo-sm.webp" type="image/webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: app móvil de una columna (máx. 480px, centrada en escritorio). Tarjetas blancas sobre gris azulado, azul Picantito como color de acción, color de zona en el banner. */
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#F4F6FA; --field:#E7ECF3; --fg:#14213D; --muted:#6B7891; --line:#DFE5EE;
  --primary:#1447B8; --primary-ink:#1447B8; --primary-soft:#E4ECFB; --cyan:#1AA6DE; --red:#E3262B;
  --open:#E8A317; --open-ink:#8A5A00; --open-soft:#FFF3D6; --close:#2E3C8C; --close-ink:#2E3C8C; --close-soft:#E6E9F7;
  --ok:#1E8E4E; --ok-soft:#E1F4E8; --bad:#D32F2F; --bad-soft:#FDE8E8; --wa:#1FA855;
  --z-salon:#1565C0; --z-terraza:#2E7D32; --z-salon1:#00838F; --z-salon2:#5E35B1; --z-caja:#455A64;
  --z-p1:#1565C0; --z-p1t:#3485D6; --z-p2:#7B1FA2; --z-p2a:#9C4DCC; --z-p3:#C25E00; --z-host:#AD1457;
  --shadow:0 1px 2px rgba(20,33,61,.05),0 6px 20px rgba(20,33,61,.06);
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --navh:68px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1524; --surface:#162034; --surface-2:#1B2740; --field:#1F2C47; --fg:#E8EDF7; --muted:#97A3BC; --line:#26344F;
  --primary:#3D74F0; --primary-ink:#8DB0FF; --primary-soft:#1D2D52;
  --open-ink:#FFC94D; --open-soft:#332710; --close-ink:#A9B6FF; --close-soft:#1F2650;
  --ok:#4CC27E; --ok-soft:#15301F; --bad:#FF6B6B; --bad-soft:#3A1A1F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1524; --surface:#162034; --surface-2:#1B2740; --field:#1F2C47; --fg:#E8EDF7; --muted:#97A3BC; --line:#26344F;
  --primary:#3D74F0; --primary-ink:#8DB0FF; --primary-soft:#1D2D52;
  --open-ink:#FFC94D; --open-soft:#332710; --close-ink:#A9B6FF; --close-soft:#1F2650;
  --ok:#4CC27E; --ok-soft:#15301F; --bad:#FF6B6B; --bad-soft:#3A1A1F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
[hidden]{display:none!important}
img{max-width:100%;height:auto;display:block}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.i{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:16px;height:16px}
.app{max-width:480px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:22px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Top */
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand img{height:40px;width:auto}
.pill-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 10px;font-size:13px;font-weight:600;min-height:38px}
.pill-btn .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.hello{display:flex;align-items:center;gap:12px}
.avatar{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,var(--cyan),var(--primary));box-shadow:0 0 0 3px var(--surface)}
.avatar img{width:40px;height:auto}
.hello .txt{flex:1;min-width:0}
.hello .hi{font-size:14px;color:var(--muted)}
.hello .nm{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;position:relative}
.round .badge{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--surface)}

/* Search */
.search{display:flex;gap:10px}
.field{flex:1;display:flex;align-items:center;gap:10px;background:var(--field);border-radius:14px;padding:0 14px;min-height:50px;color:var(--muted)}
.field input{flex:1;border:0;background:transparent;outline:0;min-width:0;font-size:15px;color:var(--fg)}
.field input::placeholder{color:var(--muted)}
.sq{width:50px;height:50px;border-radius:14px;border:0;display:grid;place-items:center;background:var(--primary);color:#fff;flex:none;transition:transform .15s}
.sq:active{transform:scale(.95)}
.sq[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* Day circles */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:0;background:transparent;display:grid;justify-items:center;gap:6px;padding:0;font-size:12px;color:var(--muted);font-weight:500}
.day .c{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:15px;color:var(--fg);position:relative;transition:background .15s,color .15s,transform .15s;font-variant-numeric:tabular-nums}
.day:active .c{transform:scale(.94)}
.day[aria-pressed="true"] .c{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(20,71,184,.3)}
.day[aria-pressed="true"]{color:var(--primary-ink);font-weight:700}
.day .c .t{position:absolute;bottom:-3px;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--bg)}
.day.off .c{opacity:.55}

/* Hero banner */
.hero{position:relative;border-radius:22px;overflow:hidden;color:#fff;background:linear-gradient(120deg,var(--zc) 0%,color-mix(in srgb,var(--zc) 70%,#0A1838) 100%);min-height:168px;box-shadow:0 10px 24px color-mix(in srgb,var(--zc) 30%,transparent)}
.hero .ph{position:absolute;right:0;top:0;bottom:0;width:48%;object-fit:cover;height:100%;-webkit-mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.35) 35%,#000 80%);mask-image:linear-gradient(90deg,transparent 0,rgba(0,0,0,.35) 35%,#000 80%);opacity:.9}
.hero .in{position:relative;padding:20px 20px 18px;display:grid;gap:4px;max-width:68%}
.hero .k{font-size:13px;opacity:.9;font-weight:500}
.hero h2{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.hero .s{font-size:13px;opacity:.9}
.hero .ring{display:flex;align-items:center;gap:10px;margin-top:10px}
.hero .bar{width:110px;height:7px;border-radius:9px;background:rgba(255,255,255,.3);overflow:hidden}
.hero .bar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .35s ease}
.hero .ring b{font-size:13px;font-variant-numeric:tabular-nums}
.hero .cta{justify-self:start;margin-top:10px;border:0;background:#fff;color:var(--fg);font-weight:700;font-size:14px;border-radius:999px;padding:10px 16px;min-height:42px}
.hero.rest{--zc:var(--primary)}
.hero .masc{position:absolute;right:10px;bottom:6px;width:120px;height:auto}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--primary-soft);color:var(--fg);border-radius:14px;padding:12px 14px;font-size:13.5px}
.note .i{color:var(--primary-ink);margin-top:1px}

/* Segmented + toolbar */
.bar-row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.seg{display:inline-flex;background:var(--field);border-radius:999px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;color:var(--muted);min-height:40px;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--primary);color:#fff;box-shadow:0 4px 10px rgba(20,71,184,.25)}
.seg button small{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.chip-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:13.5px;font-weight:600;min-height:40px}
.chip-btn[aria-pressed="true"]{border-color:var(--primary);color:var(--primary-ink);background:var(--primary-soft)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sec-h h3{font-size:18px;font-weight:700}
.sec-h a,.sec-h button.link{color:var(--primary-ink);font-weight:600;font-size:14px;text-decoration:none;border:0;background:none;padding:6px 0}

/* Tasks */
.tasks{display:grid;gap:12px;list-style:none;margin:0;padding:0}
.task{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr auto;gap:12px;padding:14px;align-items:start;transition:opacity .2s}
.ticon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--mom-soft);color:var(--mom-ink)}
.task.open{--mom-soft:var(--open-soft);--mom-ink:var(--open-ink)}
.task.close{--mom-soft:var(--close-soft);--mom-ink:var(--close-ink)}
.tb{min-width:0;display:grid;gap:4px}
.tt{font-weight:700;font-size:15px;line-height:1.35}
.std{font-size:13px;color:var(--muted);line-height:1.5}
.mat{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:8px;padding:3px 8px;background:var(--surface-2);color:var(--muted)}
.tag.photo{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--open-soft);color:var(--open-ink)}
.tag.extra{background:var(--primary-soft);color:var(--primary-ink)}
.ck{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;padding:0;margin:-2px -4px 0 0}
.ck .b{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;transition:background .15s,border-color .15s,transform .15s;background:var(--surface)}
.ck .b .i{width:16px;height:16px;stroke-width:3;color:#fff;opacity:0;transform:scale(.4);transition:opacity .15s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.ck:active .b{transform:scale(.9)}
.task.done .ck .b{background:var(--ok);border-color:var(--ok)}
.task.done .ck .b .i{opacity:1;transform:scale(1)}
.task.done{opacity:.72}
.task.done .tt{text-decoration:line-through;text-decoration-color:var(--ok);text-decoration-thickness:2px}
.empty{background:var(--surface);border-radius:18px;padding:22px;text-align:center;color:var(--muted);font-size:14px;display:grid;gap:6px;justify-items:center}
.empty img{width:84px}
.done-all{display:flex;gap:12px;align-items:center;background:var(--ok-soft);border-radius:18px;padding:14px 16px;font-weight:600;font-size:14px}
.done-all img{width:56px}

/* Report */
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px;display:grid;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 16px;min-height:50px;font-weight:700;font-size:15px;text-decoration:none}
.btn.wa{background:var(--wa);color:#fff}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn-row{display:grid;grid-template-columns:1fr auto;gap:8px}
.msg{white-space:pre-wrap;font-family:var(--font);font-size:13px;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:0;max-height:220px;overflow:auto}
.tip{display:flex;gap:10px;font-size:13px;color:var(--muted);align-items:flex-start}
.tip .i{color:var(--bad);margin-top:1px}

/* Onboarding / sheet */
.locals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lcard{border:2px solid transparent;background:var(--surface);border-radius:20px;padding:0;overflow:hidden;text-align:left;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.lcard:active{transform:scale(.98)}
.lcard img{width:100%;aspect-ratio:1/1;object-fit:cover;max-width:100%;background:var(--field)}
.lcard div{padding:10px 12px 12px;display:grid}
.lcard b{font-size:15px}
.lcard small{color:var(--muted);font-size:12px}
.lcard[aria-pressed="true"]{border-color:var(--primary)}
.lcard[aria-pressed="true"] b{color:var(--primary-ink)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.name{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;text-align:left;min-height:52px}
.name .mini{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;background:var(--zc,var(--muted));flex:none}
.name small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.name[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft)}
.scrim{position:fixed;inset:0;background:rgba(10,18,35,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:24px 24px 0 0;max-height:88vh;max-height:88dvh;overflow:auto;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.show{transform:none}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sheet .inner{max-width:480px;margin:0 auto;display:grid;gap:18px}

/* Board / Rol */
.lhead{position:relative;border-radius:20px 20px 0 0;overflow:hidden;height:110px;background:var(--field)}
.lhead img{width:100%;height:100%;object-fit:cover;max-width:100%}
.lhead::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(8,16,34,.8))}
.lhead h3{position:absolute;left:16px;bottom:12px;color:#fff;z-index:1;font-size:20px;font-weight:800}
.lhead .st{position:absolute;right:12px;bottom:12px;z-index:1;font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;background:rgba(255,255,255,.92);color:#14213D}
.lhead .st.bad{background:var(--red);color:#fff}
.board{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.brow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.zdot{width:12px;height:12px;border-radius:4px;background:var(--zc)}
.brow .zn{font-weight:700;font-size:14px}
.brow .pp{font-size:13.5px;color:var(--muted)}
.brow .pp b{color:var(--fg);font-weight:600}
.nums{display:flex;gap:4px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.n{display:inline-flex;align-items:center;gap:3px;padding:3px 7px;border-radius:8px}
.n .i{width:13px;height:13px}
.n.o{background:var(--open-soft);color:var(--open-ink)} .n.c{background:var(--close-soft);color:var(--close-ink)} .n.f{background:var(--bad-soft);color:var(--bad)}
.brow.unused{opacity:.45}
.bad-t{color:var(--bad)!important;font-weight:700}
.board-foot{padding:14px 16px 16px;border-top:1px solid var(--line);display:grid;gap:10px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
table.rol{border-collapse:separate;border-spacing:0;min-width:620px;width:100%;font-size:12px}
.rol th,.rol td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line)}
.rol thead th{color:var(--muted);font-weight:600;font-size:11.5px}
.rol thead th b{display:block;color:var(--fg);font-size:13px}
.rol th.today b,.rol th.today{color:var(--primary-ink)}
.rol td.today{background:var(--primary-soft)}
.rol .nm{position:sticky;left:0;background:var(--surface);text-align:left;padding-left:14px;font-weight:700;font-size:13px;z-index:1}
.rol tr:last-child td{border-bottom:0}
.zp{display:block;border-radius:8px;padding:6px 3px;color:#fff;background:var(--zc);font-weight:700;font-size:10.5px;line-height:1.2}
.zp.rep{outline:2px dashed var(--bad);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}

/* Guía */
.ghero{border-radius:22px;background:linear-gradient(120deg,var(--primary),#0A2A72);color:#fff;padding:20px;display:grid;gap:10px;position:relative;overflow:hidden}
.ghero h2{font-size:24px;font-weight:800;max-width:70%}
.ghero h2 em{font-style:normal;color:#FFC94D}
.ghero p{margin:0;font-size:14px;opacity:.88;max-width:72%}
.ghero img{position:absolute;right:-6px;bottom:-4px;width:118px}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fstep{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px 12px;display:grid;gap:6px;justify-items:start;font-size:12.5px;color:var(--muted)}
.fstep b{color:var(--fg);font-size:14.5px}
.fstep .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.list{display:grid;gap:10px}
.li{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.li .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-ink);font-weight:800;font-size:17px}
.li h4{font-size:15px}
.li p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.icons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.icons div{display:grid;justify-items:center;gap:6px;font-size:11.5px;font-weight:600;text-align:center;color:var(--muted)}
.icons span{width:52px;height:52px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--primary-ink)}
.cmp{display:grid;gap:10px}
.cmp .bad{background:var(--bad-soft);border-radius:18px;padding:14px 16px;font-size:14px}
.cmp .good{background:var(--ok-soft);border-radius:18px;padding:14px 16px}
.cmp h4{margin-bottom:6px}
.cmp .bad h4{color:var(--bad)} .cmp .good h4{color:var(--ok)}
.cmp ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:13.5px}
.cmp li{display:flex;gap:6px;align-items:flex-start}
.cmp li .i{width:16px;height:16px;color:var(--ok);margin-top:3px;stroke-width:3}
.warn{background:var(--open-soft);border-radius:16px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px}
.warn .i{color:var(--open-ink)}
details.q{background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
details.q summary{list-style:none;cursor:pointer;padding:14px;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;font-weight:600;font-size:14px;min-height:52px}
details.q summary::-webkit-details-marker{display:none}
details.q .qn{width:30px;height:30px;border-radius:50%;background:var(--primary-soft);color:var(--primary-ink);display:grid;place-items:center;font-weight:800;font-size:13px}
details.q .chev{transition:transform .2s;color:var(--muted)}
details.q[open] .chev{transform:rotate(90deg)}
details.q p{margin:0;padding:0 14px 14px 54px;color:var(--ok);font-weight:700;font-size:14px}
.closing{border-radius:22px;background:var(--surface);box-shadow:var(--shadow);padding:20px;display:grid;gap:6px;text-align:center;justify-items:center}
.closing img{width:200px}
.closing h3{font-size:22px;font-weight:800}
.closing h3 span{color:var(--primary-ink)}
.closing p{margin:0;font-size:13.5px;color:var(--muted)}
.page-h h2{font-size:24px;font-weight:800}
.page-h p{margin:4px 0 0;color:var(--muted);font-size:14px}

/* Bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);box-shadow:0 -1px 0 var(--line),0 -8px 24px rgba(20,33,61,.06);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav a{display:grid;justify-items:center;gap:3px;padding:10px 4px 9px;min-height:var(--navh);text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}
.nav a .ib{width:52px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
.nav a[aria-current="page"]{color:var(--primary-ink)}
.nav a[aria-current="page"] .ib{background:var(--primary-soft)}
.nav a[aria-current="page"] .i{stroke-width:2.2}

.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (hover:hover){.lcard:hover,.name:hover,.chip-btn:hover{border-color:var(--primary)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:360px){.hero h2{font-size:25px}.day .c{width:38px;height:38px}.seg button{padding:8px 11px}}
</style>

<script>
(() => {
const DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DSHORT=["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const LOCALS={P1:"Picantito 1",P2:"Picantito 2"};
const PHOTO={P1:"picantito-1",P2:"picantito-2"};
const ZCOLOR={"SALÓN":"--z-salon","TERRAZA":"--z-terraza","SALÓN 1":"--z-salon1","SALÓN 2":"--z-salon2","CAJA":"--z-caja","1.ER PISO":"--z-p1","1.ER PISO (PT)":"--z-p1t","2.º PISO":"--z-p2","2.º PISO (apoyo)":"--z-p2a","3.ER PISO":"--z-p3","APOYO (HOST)":"--z-host"};
const TICON={"Baños":"toilet-paper","Pisos":"brush","Mesas y sillas":"armchair","Menaje":"tools-kitchen-2","Basura":"trash","Equipos":"plug","Útiles":"spray","Exterior":"plant-2","Almacén":"package","Bebidas":"cup","Vidrios":"window","Servicio":"heart-handshake"};
const FIXED=["CAJA","APOYO (HOST)"];
const ic=(n,c="")=>`<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const zc=z=>`var(${ZCOLOR[z]||"--z-caja"})`;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const initials=n=>String(n||"?").trim().slice(0,1).toUpperCase();
const photo=(l,cls="",alt="")=>`<img class="${cls}" src="media/${PHOTO[l]}.webp" srcset="media/${PHOTO[l]}.webp 360w, media/${PHOTO[l]}@2x.webp 720w" sizes="(max-width:480px) 50vw, 240px" width="360" height="360" loading="lazy" decoding="async" alt="${esc(alt)}">`;

const [ly,lm,ld]=DATA.lunes.split("-").map(Number);
const weekDates=DAYS.map((_,i)=>new Date(ly,lm-1,ld+i));
const ddmm=d=>String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0");
const isoD=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const now=new Date();const todayIdx=(now.getDay()+6)%7;
const todayInWeek=weekDates.findIndex(d=>isoD(d)===isoD(now));

const store={get(k,d){try{const v=localStorage.getItem("pic:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("pic:"+k,JSON.stringify(v))}catch(e){}}};
const S={local:store.get("local","P1"),day:todayIdx,name:null,other:"",hoyDay:todayIdx,mom:now.getHours()<15?"open":"close",q:"",photoOnly:false,pending:false,rolLocal:store.get("local","P1")};
S.name=store.get("name:"+S.local,null);

const roster=l=>DATA.rol[l];
const zonesOf=l=>DATA.zonas.filter(z=>z.local===LOCALS[l]);
const zoneInfo=(l,z)=>zonesOf(l).find(x=>x.zona===z)||{};
const whoIn=(l,z,d)=>roster(l).filter(r=>r.dias[d]===z).map(r=>r.nombre);
const applies=(a,d)=>a==="Todos"||(a==="L-V"&&d<5)||(a==="S-D"&&d>=5)||(a==="Viernes"&&d===4);
const splitTC=t=>{const m=/^(TC-\d+)\s+(.*)$/.exec(t);return m?{tc:m[1],t:m[2]}:{tc:"",t}};
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();

function tasksFor(l,z,d){
  let list=DATA.catalogo.filter(t=>t.local===LOCALS[l]&&t.zona===z&&applies(t.aplica,d)).map(t=>({...t}));
  const notes=[];
  if(l==="P2"&&z==="1.ER PISO"&&!whoIn(l,"1.ER PISO (PT)",d).length){
    list=list.concat(DATA.catalogo.filter(t=>t.local===LOCALS[l]&&t.zona==="1.ER PISO (PT)"&&t.mom==="CIERRE"&&applies(t.aplica,d)).map(t=>({...t,extra:"Cubres al part time"})));
    notes.push("Hoy no hay part time: también haces el cierre del 1.er piso (PT). Ya está sumado a tu lista.");
  }
  if(l==="P2"&&z==="2.º PISO"&&whoIn(l,"2.º PISO (apoyo)",d).length){
    list=list.filter(t=>!(t.mom==="CIERRE"&&/apoyo/i.test(t.nota||"")));
    notes.push(`Hoy hay apoyo en el 2.º piso (${whoIn(l,"2.º PISO (apoyo)",d).join(", ")}): baños y estación del cierre los hace el apoyo.`);
  }
  return {open:list.filter(t=>t.mom==="APERTURA"),close:list.filter(t=>t.mom==="CIERRE"),notes};
}
const ckKey=(l,z,d)=>`ck:${isoD(weekDates[d])}:${l}:${z}`;
const getCk=(l,z,d)=>store.get(ckKey(l,z,d),{});
const setCk=(l,z,d,v)=>store.set(ckKey(l,z,d),v);
const currentZone=()=>{const me=roster(S.local).find(r=>r.nombre===S.name);return S.other||(me?me.dias[S.day]:"—")};

function toast(m,icon="check"){const t=document.getElementById("toast");t.innerHTML=ic(icon,"sm")+esc(m);t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),1900)}
function copy(text,wrap){
  const ok=()=>toast("Copiado. Pégalo en WhatsApp","copy");
  const fb=()=>{const pre=wrap&&wrap.querySelector("pre");if(pre){pre.hidden=false;const r=document.createRange();r.selectNodeContents(pre);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texto seleccionado: cópialo","copy")}};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(ok,fb);else fb();
}
const waLink=t=>"https://wa.me/?text="+encodeURIComponent(t);

/* ---------- comunes ---------- */
function daysRow(sel,attr){
  return `<div class="days" role="group" aria-label="Día de la semana">${DAYS.map((n,i)=>{
    const off=attr==="day"&&S.name&&!S.other&&(roster(S.local).find(r=>r.nombre===S.name)||{dias:[]}).dias[i]==="—";
    return `<button type="button" class="day${off?" off":""}" data-${attr}="${i}" aria-pressed="${i===sel}" aria-label="${n} ${ddmm(weekDates[i])}${i===todayInWeek?" (hoy)":""}"><span class="c">${weekDates[i].getDate()}${i===todayInWeek?'<i class="t"></i>':""}</span>${DSHORT[i]}</button>`}).join("")}</div>`;
}
function topBar(){
  return `<div class="brand"><img src="media/logo-sm.webp" width="260" height="${Math.round(260*0.64)}" alt="El Picantito" style="height:48px;width:auto"><button type="button" class="pill-btn" data-open-sheet><span class="dot"></span>${LOCALS[S.local]}${ic("switch-horizontal","sm")}</button></div>`;
}

/* ---------- MI ZONA ---------- */
function renderMiZona(){
  const v=document.getElementById("v-mi-zona");
  if(S.name&&!roster(S.local).some(r=>r.nombre===S.name))S.name=null;
  if(!S.name){v.innerHTML=topBar()+onboarding();return}
  const d=S.day,l=S.local,zone=currentZone();
  const me=roster(l).find(r=>r.nombre===S.name);const isMine=!S.other||S.other===me.dias[d];
  let h=topBar()+`
  <div class="hello"><div class="avatar" aria-hidden="true">${esc(initials(S.name))}</div><div class="txt"><div class="hi">Hola 👋</div><div class="nm">${esc(S.name)}</div></div>
  <button type="button" class="round" data-open-sheet aria-label="Cambiar de persona o local">${ic("users")}</button></div>`;
  h+=`<div class="search"><span class="field">${ic("search")}<input id="q" type="search" placeholder="Buscar tarea: baños, mesas, tachos…" value="${esc(S.q)}" autocomplete="off"></span><button type="button" class="sq" data-photo aria-pressed="${S.photoOnly}" aria-label="Mostrar solo tareas con foto">${ic("camera")}</button></div>`;
  h+=daysRow(d,"day");
  if(zone==="—"){
    h+=`<div class="hero rest"><img class="masc" src="media/mascota.webp" width="240" height="186" alt=""><div class="in"><div class="k">${DAYS[d]} ${ddmm(weekDates[d])}</div><h2>Día libre</h2><div class="s">Según el rol no tienes zona este día. Si cubres a alguien, tomas su zona completa.</div></div></div>`+otherZone(l);
    v.innerHTML=h;return;
  }
  const info=zoneInfo(l,zone),T=tasksFor(l,zone,d),all=[...T.open,...T.close],ck=getCk(l,zone,d);
  const done=all.filter(t=>ck[t.code]).length,pct=all.length?Math.round(done/all.length*100):0;
  h+=`<div class="hero" style="--zc:${zc(zone)}">${photo(l,"ph","")}<div class="in">
    <div class="k">${isMine?`${DAYS[d]} ${ddmm(weekDates[d])} · estás en`:`Viendo · ${esc(whoIn(l,zone,d).join(", ")||"sin asignar")}`}</div>
    <h2>${esc(zone)}</h2><div class="s">${esc(info.atiende||"")}</div>
    <div class="ring"><span class="bar"><i style="width:${pct}%"></i></span><b>${done}/${all.length} listas</b></div></div></div>`;
  if(info.resp)h+=`<div class="note">${ic("info-circle")}<span>${esc(info.resp)}</span></div>`;
  T.notes.forEach(n=>h+=`<div class="note">${ic("alert-triangle")}<span>${esc(n)}</span></div>`);
  const cnt=a=>`${a.filter(t=>ck[t.code]).length}/${a.length}`;
  h+=`<div class="bar-row"><div class="seg" role="group" aria-label="Momento"><button type="button" data-mom="open" aria-pressed="${S.mom==="open"}">${ic("sunrise","sm")}Apertura <small>${cnt(T.open)}</small></button><button type="button" data-mom="close" aria-pressed="${S.mom==="close"}">${ic("moon-stars","sm")}Cierre <small>${cnt(T.close)}</small></button></div>
  <button type="button" class="chip-btn" data-pending aria-pressed="${S.pending}">${ic("clipboard-check","sm")}Faltan</button></div>`;
  let list=S.mom==="open"?T.open:T.close;
  const q=norm(S.q);
  if(q)list=list.filter(t=>norm(t.tarea+" "+t.std+" "+t.tipo).includes(q));
  if(S.photoOnly)list=list.filter(t=>t.foto==="Sí");
  if(S.pending)list=list.filter(t=>!ck[t.code]);
  h+=`<div class="sec-h"><h3>${S.mom==="open"?"Antes de abrir":"Al cerrar el turno"}</h3><span class="muted" style="font-size:13px">${S.mom==="open"?"Ámbar = apertura":"Azul = cierre"}</span></div>`;
  if(!list.length){
    const why=(q||S.photoOnly||S.pending)?"No hay tareas con ese filtro.":`No hay tareas de ${S.mom==="open"?"apertura":"cierre"} para esta zona este día.`;
    h+=`<div class="empty"><img src="media/mascota.webp" width="240" height="186" alt="" loading="lazy">${why}</div>`;
  } else h+=`<ul class="tasks">${list.map(t=>taskCard(t,ck)).join("")}</ul>`;
  if(all.length&&done===all.length)h+=`<div class="done-all"><img src="media/mascota.webp" width="240" height="186" alt="">¡Zona completa! Envía tus fotos y avisa al supervisor.</div>`;
  const msg=reportMsg(l,zone,d,T,ck);
  h+=`<div class="card" data-wrap><div class="sec-h"><h3>Avisar al supervisor</h3></div>
    <div class="tip">${ic("camera","sm")}<span>Primero terminas, después la foto: zona completa, con luz y de frente. Envíala con tu nombre y la zona. Al cierre, limpia también tu casillero.</span></div>
    <div class="btn-row"><a class="btn wa" href="${waLink(msg)}" target="_blank" rel="noopener">${ic("brand-whatsapp")}Enviar por WhatsApp</a><button type="button" class="btn ghost" data-copy aria-label="Copiar mensaje">${ic("copy")}</button></div>
    <pre class="msg" hidden>${esc(msg)}</pre></div>`;
  h+=otherZone(l);
  v.innerHTML=h;
}
function taskCard(t,ck){
  const {tc,t:title}=splitTC(t.tarea),done=!!ck[t.code],conf=/confirmar/i.test(t.nota||"");
  const plain=t.nota&&!conf&&!/apoyo|part time/i.test(t.nota)?t.nota:"";
  return `<li class="task ${t.mom==="APERTURA"?"open":"close"}${done?" done":""}">
    <span class="ticon" title="${esc(t.tipo)}">${ic(TICON[t.tipo]||"sparkles")}</span>
    <div class="tb"><div class="tt">${esc(title)}</div><div class="std">${esc(t.std)}</div>
      ${t.mat&&t.mat!=="—"?`<div class="mat">${ic("spray","sm")}${esc(t.mat)}</div>`:""}
      <div class="tags">${t.foto==="Sí"?`<span class="tag photo">${ic("camera","sm")}Foto</span>`:""}${t.extra?`<span class="tag extra">${esc(t.extra)}</span>`:""}${plain?`<span class="tag warn">${esc(plain)}</span>`:""}${conf?'<span class="tag warn">Por confirmar</span>':""}<span class="tag">${t.code}${tc?" · "+tc:""}</span></div></div>
    <button type="button" class="ck" data-code="${t.code}" aria-pressed="${done}" aria-label="Marcar como hecha: ${esc(title)}"><span class="b">${ic("check")}</span></button></li>`;
}
function otherZone(l){
  return `<label class="field" style="background:var(--surface);border:1px solid var(--line)">${ic("map-pin")}<span class="sr">Ver otra zona</span><select id="other-zone" style="flex:1;border:0;background:transparent;min-height:48px;outline:0;color:var(--fg)"><option value="">Ver mi zona del rol</option>${zonesOf(l).map(z=>`<option value="${esc(z.zona)}" ${S.other===z.zona?"selected":""}>Ver zona: ${esc(z.zona)}</option>`).join("")}</select></label>`;
}
function reportMsg(l,z,d,T,ck){
  const c=a=>`${a.filter(t=>ck[t.code]).length}/${a.length}`;
  const pend=[...T.open,...T.close].filter(t=>!ck[t.code]).map(t=>"• "+splitTC(t.tarea).t);
  return `🧹 ${LOCALS[l].toUpperCase()} – ${DAYS[d].toUpperCase()} ${ddmm(weekDates[d])}\n👤 ${(S.name||"").toUpperCase()} → ${z}\n🌅 Apertura: ${c(T.open)}\n🧹 Cierre: ${c(T.close)}`+(pend.length?`\n\nPendiente:\n${pend.join("\n")}`:"\n\n✅ Zona completa. Envío fotos 📸");
}
function onboarding(){
  return `<div class="hello"><div class="avatar" aria-hidden="true"><img src="media/mascota.webp" width="240" height="186" alt=""></div><div class="txt"><div class="hi">Hola 👋</div><div class="nm">¿Quién eres?</div></div></div>`+pickerHTML();
}
function pickerHTML(){
  const d=S.day;
  return `<div class="sec-h"><h3>1. Elige tu local</h3></div>
  <div class="locals">${Object.keys(LOCALS).map(k=>`<button type="button" class="lcard" data-local="${k}" aria-pressed="${k===S.local}">${photo(k,"",LOCALS[k])}<div><b>${LOCALS[k]}</b><small>${roster(k).length} colaboradores</small></div></button>`).join("")}</div>

function openSheet(){
  const sh=document.getElementById("sheet"),sc=document.getElementById("scrim");
  document.getElementById("sheet-body").innerHTML=`<div class="page-h"><h2>Cambiar</h2><p>Tu elección se guarda en este celular.</p></div>`+pickerHTML();
  sh.hidden=sc.hidden=false;requestAnimationFrame(()=>{sh.classList.add("show");sc.classList.add("show")});
}
function closeSheet(){
  const sh=document.getElementById("sheet"),sc=document.getElementById("scrim");
  sh.classList.remove("show");sc.classList.remove("show");setTimeout(()=>{sh.hidden=sc.hidden=true},280);
}

  for(const l of ["P1","P2"]){
    const we=d>=5,lines=[];let miss=0;
    const rows=zonesOf(l).map(z=>{
      const ppl=whoIn(l,z.zona,d),need=we?z.minSD:z.minLV,T=tasksFor(l,z.zona,d),all=[...T.open,...T.close];

      if(ppl.length){who=`<b>${esc(ppl.join(", "))}</b>`;ppl.forEach(p=>lines.push(`👤 ${p.toUpperCase()} → ${z.zona}`))}

    const msg=`📋 ${LOCALS[l].toUpperCase()} – ${DAYS[d].toUpperCase()} ${ddmm(weekDates[d])}\n\n${lines.join("\n")}\n\nRevisa tus tareas en MI ZONA. 📸 Foto al terminar.`;

  v.innerHTML=h;
}

/* ---------- Router y eventos ---------- */
const VIEWS={"mi-zona":renderMiZona,"hoy":renderHoy,"rol":renderRol,"guia":renderGuia};
function route(){
  const id=location.hash.slice(1),cur=VIEWS[id]?id:"mi-zona";
  Object.keys(VIEWS).forEach(x=>document.getElementById("v-"+x).hidden=x!==cur);
  document.querySelectorAll(".nav a").forEach(a=>{if(a.dataset.v===cur)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  VIEWS[cur]();window.scrollTo(0,0);
}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y)}
document.addEventListener("click",e=>{
  if(e.target.id==="scrim"){closeSheet();return}
  const b=e.target.closest("button");if(!b)return;
  const inSheet=!!b.closest("#sheet");
  if(b.hasAttribute("data-open-sheet"))openSheet();
  else if(b.dataset.local){S.local=b.dataset.local;store.set("local",S.local);S.name=store.get("name:"+S.local,null);S.other="";S.rolLocal=S.local;if(inSheet)document.getElementById("sheet-body").innerHTML=`<div class="page-h"><h2>Cambiar</h2><p>Tu elección se guarda en este celular.</p></div>`+pickerHTML();keepScroll(renderMiZona)}
  else if(b.dataset.name!=null){S.name=b.dataset.name;store.set("name:"+S.local,S.name);S.other="";if(inSheet)closeSheet();renderMiZona();window.scrollTo(0,0)}
  else if(b.dataset.day!=null){S.day=+b.dataset.day;S.other="";keepScroll(renderMiZona)}
  else if(b.dataset.hday!=null){S.hoyDay=+b.dataset.hday;keepScroll(renderHoy)}
  else if(b.dataset.rol){S.rolLocal=b.dataset.rol;renderRol()}
  else if(b.dataset.mom){S.mom=b.dataset.mom;keepScroll(renderMiZona)}
  else if(b.hasAttribute("data-photo")){S.photoOnly=!S.photoOnly;keepScroll(renderMiZona)}
  else if(b.hasAttribute("data-pending")){S.pending=!S.pending;keepScroll(renderMiZona)}
  else if(b.dataset.code){
    const zone=currentZone(),ck=getCk(S.local,zone,S.day),c=b.dataset.code;
    if(ck[c])delete ck[c];else ck[c]=1;setCk(S.local,zone,S.day,ck);
    const t=DATA.catalogo.find(x=>x.code===c&&x.local===LOCALS[S.local]);
    keepScroll(renderMiZona);
    if(ck[c]&&t&&t.foto==="Sí")toast("Ahora toma la foto y envíala","camera");
    if(navigator.vibrate&&ck[c])try{navigator.vibrate(12)}catch(_){}
  }
  else if(b.hasAttribute("data-copy")){const w=b.closest("[data-wrap]");copy(w.querySelector("pre").textContent,w)}
});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;const pos=e.target.selectionStart;renderMiZona();const n=document.getElementById("q");n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}});
document.addEventListener("change",e=>{if(e.target.id==="other-zone"){S.other=e.target.value;keepScroll(renderMiZona)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!document.getElementById("sheet").hidden)closeSheet()});
window.addEventListener("hashchange",route);
route();
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
